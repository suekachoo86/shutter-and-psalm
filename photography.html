<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore the Shutter & Psalm photography gallery—a collection of landscapes and details reflecting the beauty of God’s creation.">
  <title>Photography | Shutter &amp; Psalm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&amp;family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/shutter-and-psalm-monogram.png">
  <style>
    :root{--ink:#2b202a;--deep:#180f18;--rose:#b99a98;--cream:#f3f0e9;--white:#fffdf8;--serif:"Libre Baskerville",Georgia,serif;--sans:"DM Sans",Arial,sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--deep);color:var(--white);font:16px/1.65 var(--sans)}
    a{color:inherit}
    .site-header{position:absolute;z-index:20;top:0;right:0;left:0;display:flex;min-height:76px;padding:0 2rem;align-items:center;justify-content:space-between;background:#180f18bd;border-bottom:1px solid #ffffff24;backdrop-filter:blur(7px)}
    .header-mark{display:block;width:76px;height:72px;background:var(--white);-webkit-mask:url("assets/shutter-and-psalm-monogram.png") center/contain no-repeat;mask:url("assets/shutter-and-psalm-monogram.png") center/contain no-repeat}
    .nav-links{display:flex;margin:0;padding:0;align-items:center;gap:clamp(1rem,2.4vw,2rem);list-style:none}
    .nav-links a{color:var(--white);font-size:.76rem;font-weight:600;letter-spacing:.14em;text-decoration:none;text-transform:uppercase}
    .nav-links a:hover,.nav-links a:focus-visible,.nav-links a[aria-current="page"]{text-decoration:underline;text-underline-offset:.35rem}
    .cart-link{display:grid;width:38px;height:38px;place-items:center}
    .cart-link svg{width:18px}
    .menu-button{display:none;border:0;background:transparent;color:var(--white);cursor:pointer}

    .cinematic{position:relative;display:flex;min-height:640px;padding-top:76px;flex-direction:column;overflow:hidden;background:url("assets/gallery_hero.jpg") center 47%/cover no-repeat;isolation:isolate}
    .cinematic::before{position:absolute;z-index:-2;inset:0;background:inherit;content:""}
    .cinematic::after{position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,#180f18dc 0%,#180f1896 48%,#180f183d 100%),linear-gradient(180deg,#180f181f 30%,#180f18bd 100%);content:""}
    .hero-copy{display:flex;width:min(100% - 3rem,1180px);margin:auto;padding:5.2rem 0 3.4rem;flex:1;flex-direction:column;align-items:flex-start;justify-content:center}
    .eyebrow{margin:0 0 1rem;color:#e3c9c3;font-size:.72rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
    .hero-copy h1{max-width:790px;margin:0;font:400 clamp(2.8rem,6vw,5.4rem)/1.08 var(--serif);letter-spacing:-.035em}
    .hero-copy>p:not(.eyebrow){max-width:535px;margin:1.55rem 0 0;color:#fffdf8d4;font-size:clamp(.98rem,1.5vw,1.12rem);line-height:1.75}.scripture-verse{font-family:var(--serif);font-style:italic}.scripture-reference{display:block;margin-top:.35rem;font:400 .72rem/1.5 var(--sans);font-style:normal;letter-spacing:.14em;text-transform:uppercase}
    .gallery{padding:5.5rem 0 6rem;background:var(--deep)}
    .gallery-heading{width:min(100% - 3rem,1180px);margin:0 auto 2.4rem;text-align:center}
    .gallery-heading .eyebrow{margin-bottom:.65rem}
    .gallery-heading h2{margin:0;font:400 clamp(2.15rem,4vw,3.4rem)/1.15 var(--serif)}
    .gallery-grid{width:min(100% - 3rem,1180px);margin-inline:auto;columns:3 300px;column-gap:1rem}
    .gallery-item{display:block;width:100%;margin:0 0 1rem;padding:0;overflow:hidden;border:1px solid #fffdf824;background:transparent;break-inside:avoid;cursor:zoom-in}
    .gallery-item img{display:block;width:100%;height:auto;transition:transform .45s ease,filter .45s ease}
    .gallery-item:hover img,.gallery-item:focus-visible img{filter:brightness(1.07);transform:scale(1.025)}
    .gallery-item:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
    .lightbox{width:min(94vw,1200px);max-height:92vh;padding:0;border:0;background:transparent;color:var(--white)}
    .lightbox::backdrop{background:#100910ed;backdrop-filter:blur(5px)}
    .lightbox img{display:block;max-width:100%;max-height:88vh;margin:auto;object-fit:contain;box-shadow:0 18px 60px #0009}
    .lightbox-close{position:fixed;top:1rem;right:1rem;display:grid;width:46px;height:46px;padding:0;place-items:center;border:1px solid #fffdf88f;border-radius:50%;background:#180f18d9;color:var(--white);font-size:1.65rem;line-height:1;cursor:pointer}

    .site-footer{background:var(--deep);border-top:1px solid #ffffff17}
    .footer-inner{display:grid;min-height:76px;width:min(100% - 3rem,1180px);margin-inline:auto;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.5rem}
    .copyright,.footer-devotion{margin:0;color:#ffffff9e;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
    .footer-devotion{justify-self:end}
    .social-links{display:flex;gap:.8rem}
    .social-links a{display:grid;width:34px;height:34px;place-items:center;border:1px solid #fffdf86b;border-radius:50%;color:var(--white);text-decoration:none;transition:.2s}
    .social-links svg{display:block;width:17px;height:17px}
    .social-links a:hover,.social-links a:focus-visible{background:#fffdf81a;border-color:var(--white);transform:translateY(-2px)}

    @media(max-width:900px){
      .nav-links{position:absolute;z-index:30;top:68px;right:1.5rem;display:none;width:min(280px,calc(100vw - 3rem));padding:1rem;flex-direction:column;align-items:stretch;gap:0;background:#f3f0e9fa;border:1px solid #2b202a29}
      .nav-links.open{display:flex}
      .nav-links a{display:block;padding:.75rem;color:var(--deep)}
      .menu-button{display:grid;width:42px;height:42px;place-items:center}
      .cart-item{display:none}
      .cinematic{min-height:620px}
    }
    @media(max-width:640px){
      .site-header{min-height:68px;padding:0 .9rem}
      .header-mark{width:64px;height:60px}
      .cinematic{min-height:650px;padding-top:68px;background-position:48% center}
      .cinematic::after{background:linear-gradient(90deg,#180f18df 0%,#180f189e 70%,#180f1852 100%),linear-gradient(180deg,#180f181f 30%,#180f18d1 100%)}
      .hero-copy{width:min(100% - 2rem,1180px);padding:4.6rem 0 2.5rem}
      .hero-copy h1{font-size:clamp(2.55rem,12vw,3.7rem);line-height:1.1}
      .hero-copy>p:not(.eyebrow){max-width:390px;font-size:1rem}
      .gallery{padding:4rem 0}
      .gallery-heading,.gallery-grid{width:min(100% - 2rem,1180px)}
      .gallery-heading{margin-bottom:1.75rem}
      .gallery-grid{columns:1}
      .footer-inner{grid-template-columns:1fr auto;padding:1.2rem 0}
      .footer-devotion{display:none}
      .social-links{justify-self:end}
    }
  </style>
</head>
<body>
  <header class="site-header" aria-label="Primary navigation">
    <a href="index.html" aria-label="Shutter and Psalm home"><span class="header-mark" aria-hidden="true"></span></a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="primary-menu" aria-label="Open navigation menu"><svg viewBox="0 0 24 24" width="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <ul class="nav-links" id="primary-menu">
      <li><a href="index.html">Home</a></li><li><a href="photography.html" aria-current="page">Gallery</a></li><li><a href="shop.html">Shop</a></li><li><a href="about.html">About</a></li><li><a href="journal.html">Journal</a></li><li><a href="contact.html">Contact</a></li>
      <li class="cart-item"><a class="cart-link" href="shop.html" aria-label="View shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H7M10 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm7 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a></li>
    </ul>
  </header>

  <main>
    <section class="cinematic">
      <div class="hero-copy">
        <p class="eyebrow">Shutter &amp; Psalm Photography</p>
        <h1>God’s Creation<br>Through My Lens</h1>
        <p class="scripture-verse">“God saw all that he had made, and it was very good.”<span class="scripture-reference">— Genesis 1:31</span></p>
      </div>
    </section>
    <section class="gallery" aria-labelledby="gallery-title">
      <div class="gallery-heading">
        <p class="eyebrow">Shutter &amp; Psalm Photography</p>
        <h2 id="gallery-title">The Gallery</h2>
      </div>
      <div class="gallery-grid">
        <button class="gallery-item" type="button" data-full="assets/waterfall1.jpg" aria-label="View waterfall photograph larger"><img src="assets/waterfall1.jpg" alt="Water cascading over a forest waterfall" loading="lazy"></button>
        <button class="gallery-item" type="button" data-full="assets/macro_flower1.jpg" aria-label="View flower photograph larger"><img src="assets/macro_flower1.jpg" alt="Close-up detail of a flower" loading="lazy"></button>
        <button class="gallery-item" type="button" data-full="assets/waterfall2.jpg" aria-label="View vertical waterfall photograph larger"><img src="assets/waterfall2.jpg" alt="Vertical view of a waterfall surrounded by greenery" loading="lazy"></button>
        <button class="gallery-item" type="button" data-full="assets/sunset1.jpg" aria-label="View sunset photograph larger"><img src="assets/sunset1.jpg" alt="Golden sunset light over the ocean" loading="lazy"></button>
        <button class="gallery-item" type="button" data-full="assets/sunset2.jpg" aria-label="View second sunset photograph larger"><img src="assets/sunset2.jpg" alt="Colorful evening sky above the shoreline" loading="lazy"></button>
        <button class="gallery-item" type="button" data-full="assets/sunset3.jpg" aria-label="View third sunset photograph larger"><img src="assets/sunset3.jpg" alt="Warm sunset over calm ocean waves" loading="lazy"></button>
      </div>
    </section>
  </main>

  <dialog class="lightbox" aria-label="Expanded photograph">
    <button class="lightbox-close" type="button" aria-label="Close enlarged photograph">&times;</button>
    <img src="" alt="">
  </dialog>

  <footer class="site-footer"><div class="footer-inner"><p class="copyright">© <span id="year"></span> Shutter &amp; Psalm</p><div class="social-links" aria-label="Social media links"><a href="https://www.instagram.com/shutterandpsalm/" target="_blank" rel="noopener noreferrer" aria-label="Follow Shutter and Psalm on Instagram" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/></svg></a><a href="https://www.facebook.com/profile.php?id=61583411422359" target="_blank" rel="noopener noreferrer" aria-label="Follow Shutter and Psalm on Facebook" title="Facebook"><svg viewBox="0 0 320 512" aria-hidden="true"><path fill="currentColor" d="M279.14 288l14.22-92.66h-88.91v-60.13c0-25.35 12.42-50.06 52.24-50.06H297V6.26S260.43 0 225.36 0c-73.22 0-121.08 44.38-121.08 124.72v70.62H22.89V288h81.39v224h100.17V288z"/></svg></a></div><p class="footer-devotion">To Him be all the glory.</p></div></footer>

  <script>
    const menuButton=document.querySelector('.menu-button'),menu=document.querySelector('.nav-links');
    menuButton.addEventListener('click',()=>{const open=menu.classList.toggle('open');menuButton.setAttribute('aria-expanded',String(open))});
    menu.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{menu.classList.remove('open');menuButton.setAttribute('aria-expanded','false')}));
    document.querySelector('#year').textContent=new Date().getFullYear();
    const lightbox=document.querySelector('.lightbox'),lightboxImage=lightbox.querySelector('img');
    document.querySelectorAll('.gallery-item').forEach(item=>item.addEventListener('click',()=>{const image=item.querySelector('img');lightboxImage.src=item.dataset.full;lightboxImage.alt=image.alt;lightbox.showModal()}));
    lightbox.querySelector('.lightbox-close').addEventListener('click',()=>lightbox.close());
    lightbox.addEventListener('click',event=>{if(event.target===lightbox)lightbox.close()});
  </script>
</body>
</html>
